<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REAL-TIME TOPOLOGY // NETWORK MAP GATE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark: #000000;
      --bg-secondary: #0a0a0d;
      --bg-panel: #050508;
      --bg-card: #08080c;
      --border-color: #1a1a24;
      --border-hover: #38bdf8;
      --text-primary: #e2e8f0;
      --text-dim: #64748b;
      --text-muted: #475569;
      
      /* Neon Cyber Colors (Ref: PyDrive 8000) */
      --cyan: #38bdf8;
      --blue: #3b82f6;
      --green: #10b981;
      --pink: #f43f5e;
      --yellow: #f59e0b;
      --purple: #c084fc;
      --indigo: #818cf8;
      --white: #ffffff;
      
      --cyan-glow: rgba(56, 189, 248, 0.25);
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(ellipse at 50% 30%, rgba(56, 189, 248, 0.06) 0%, rgba(0, 0, 0, 0.98) 70%),
        linear-gradient(rgba(56, 189, 248, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.035) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Cyber Scanline effect overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 999;
      opacity: 0.6;
    }

    .text-white { color: var(--white); }
    .text-cyan { color: var(--cyan); }
    .text-blue { color: var(--blue); }
    .text-green { color: var(--green); }
    .text-pink { color: var(--pink); }
    .text-yellow { color: var(--yellow); }

    /* ============================================================
       CYBERPUNK LOGIN GATE (ALA PYDRIVE 8000)
       ============================================================ */
    .login-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      width: 100%;
      min-height: 100vh;
      z-index: 10;
    }

    .login-card {
      background: rgba(8, 8, 12, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 440px;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.95), 0 0 25px rgba(56, 189, 248, 0.12);
      animation: cyber-boot 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      border-radius: 2px;
    }

    /* Decorative Cyber HUD Corner Brackets */
    .corner-bracket {
      position: absolute;
      width: 10px;
      height: 10px;
      pointer-events: none;
      z-index: 20;
    }
    .corner-tl { top: -1px; left: -1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
    .corner-tr { top: -1px; right: -1px; border-top: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
    .corner-bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
    .corner-br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

    /* Card Top Bar (PyDrive Style) */
    .login-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      background: rgba(56, 189, 248, 0.04);
    }

    .cyber-brand {
      color: var(--cyan);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status-indicator {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.08em;
    }

    .status-indicator .dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    /* HUD Metrics Ribbon */
    .login-hud-bar {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.35);
    }

    .hud-block {
      flex: 1;
      padding: 0.55rem 0.9rem;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .hud-block:last-child {
      border-right: none;
    }

    .hud-val {
      font-size: 0.76rem;
      font-weight: 700;
    }
    .hud-lbl {
      font-size: 0.58rem;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Card Inner Body */
    .login-body {
      padding: 30px 28px;
    }

    .login-hero {
      text-align: center;
      margin-bottom: 24px;
    }

    .cyber-icon-hex {
      width: 54px;
      height: 54px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid var(--cyan);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25), inset 0 0 10px rgba(56, 189, 248, 0.1);
      color: var(--cyan);
      position: relative;
    }

    .cyber-icon-hex::before {
      content: "";
      position: absolute;
      inset: 2px;
      border: 1px dashed rgba(56, 189, 248, 0.4);
    }

    .login-hero h2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--white);
      margin-bottom: 4px;
    }

    .login-hero p {
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .form-label .label-tag {
      color: var(--cyan);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .cyber-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--border-color);
      color: var(--cyan);
      padding: 0.75rem 2.8rem 0.75rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      border-radius: 0;
      letter-spacing: 0.06em;
    }

    .cyber-input:focus {
      border-color: var(--cyan);
      background: rgba(4, 10, 18, 0.85);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
    }

    .cyber-input::placeholder {
      color: #334155;
      font-size: 0.8rem;
    }

    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      padding: 4px;
    }

    .toggle-pwd:hover {
      color: var(--cyan);
    }

    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      font-size: 0.74rem;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      letter-spacing: 0.03em;
    }

    .remember-label input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: grid;
      place-content: center;
      border-radius: 0;
      transition: all 0.2s;
    }

    .remember-label input[type="checkbox"]:checked {
      background: var(--cyan);
      border-color: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }

    .remember-label input[type="checkbox"]:checked::after {
      content: "✓";
      color: #000000;
      font-size: 10px;
      font-weight: 900;
    }

    /* Cyber Action Button (PyDrive Style) */
    .cyber-btn {
      width: 100%;
      background: rgba(56, 189, 248, 0.15);
      color: var(--cyan);
      border: 1px solid var(--cyan);
      padding: 0.8rem 1.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      border-radius: 0;
    }

    .cyber-btn:hover {
      background: var(--cyan);
      color: #000000;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.65);
      transform: translateY(-1px);
    }

    .cyber-btn:active {
      transform: translateY(0);
    }

    .cyber-btn-arrow {
      transition: transform 0.2s ease;
    }
    .cyber-btn:hover .cyber-btn-arrow {
      transform: translateX(4px);
    }

    /* Cyber Glitch / Shake Error Box */
    .error-box {
      display: none;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid var(--pink);
      color: var(--pink);
      padding: 0.65rem 0.9rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 18px;
      text-align: center;
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.2);
    }

    .shake {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(3px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }

    .login-footer {
      padding: 0.75rem 1.4rem;
      border-top: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    .chip-badge {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--cyan);
      padding: 2px 7px;
      font-size: 0.62rem;
      font-weight: 700;
    }

    @keyframes cyber-boot {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ============================================================
       CYBERPUNK PORTAL DASHBOARD (AFTER AUTH)
       ============================================================ */
    .portal-container {
      display: none; /* Revealed on auth */
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
      z-index: 10;
    }

    /* Global Top Controls Bar */
    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1.75rem;
      border-bottom: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
      width: 100%;
    }

    .top-brand {
      color: var(--cyan);
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .top-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      padding: 0.45rem 1rem;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.06em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .top-btn:hover {
      border-color: var(--pink);
      color: var(--pink);
      background: rgba(244, 63, 94, 0.08);
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.25);
    }

    /* Metrics Header Bar (Identical to PyDrive 8000) */
    .metrics-bar {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      padding: 0 1.5rem;
      background: rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
      overflow-x: auto;
      white-space: nowrap;
    }

    .metric-block {
      display: flex;
      flex-direction: column;
      padding: 0.75rem 1.5rem;
      border-right: 1px solid var(--border-color);
      gap: 2px;
    }

    .metric-value {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .metric-label {
      font-size: 0.62rem;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Main Dashboard Grid Area */
    .dashboard-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      max-width: 1040px;
      margin: 0 auto;
      width: 100%;
      gap: 32px;
    }

    .section-title-wrap {
      text-align: center;
      width: 100%;
    }

    .section-title-wrap h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .section-title-wrap p {
      font-size: 0.74rem;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
      gap: 16px;
      width: 100%;
    }

    /* Cyber Service Card */
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 148px;
      padding: 22px;
      background: rgba(8, 8, 12, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      cursor: pointer;
      opacity: 0;
      animation: spring-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    /* Small subtle corner indicator on cards */
    .card::before {
      content: "";
      position: absolute;
      top: 0; right: 0;
      width: 0; height: 0;
      border-style: solid;
      border-width: 0 14px 14px 0;
      border-color: transparent var(--border-color) transparent transparent;
      transition: border-color 0.25s;
    }

    .card:hover::before {
      border-color: transparent var(--accent) transparent transparent;
    }

    .card:nth-child(1) { animation-delay: 0.03s; --accent: var(--cyan);   --glow: rgba(56, 189, 248, 0.25); }
    .card:nth-child(2) { animation-delay: 0.06s; --accent: var(--purple); --glow: rgba(192, 132, 252, 0.25); }
    .card:nth-child(3) { animation-delay: 0.09s; --accent: var(--yellow); --glow: rgba(251, 146, 60, 0.25); }
    .card:nth-child(4) { animation-delay: 0.12s; --accent: var(--green);  --glow: rgba(16, 185, 129, 0.25); }
    .card:nth-child(5) { animation-delay: 0.15s; --accent: #22d3ee;        --glow: rgba(34, 211, 238, 0.25); }
    .card:nth-child(6) { animation-delay: 0.18s; --accent: var(--pink);   --glow: rgba(244, 63, 94, 0.25); }
    .card:nth-child(7) { animation-delay: 0.21s; --accent: #fbbf24;        --glow: rgba(251, 191, 36, 0.25); }
    .card:nth-child(8) { animation-delay: 0.24s; --accent: var(--indigo); --glow: rgba(129, 140, 248, 0.25); }

    @keyframes spring-in {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 12px 30px -8px var(--glow), 0 0 15px rgba(0,0,0,0.8);
      background: rgba(12, 12, 18, 0.95);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .icon-box {
      width: 42px;
      height: 42px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover .icon-box {
      background: var(--accent);
      color: #000000;
      border-color: var(--accent);
      transform: scale(1.08) rotate(-3deg);
      box-shadow: 0 0 15px var(--accent);
    }

    .logo {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-dim);
      background: rgba(0, 0, 0, 0.6);
      padding: 3px 8px;
      border: 1px solid var(--border-color);
      letter-spacing: 0.05em;
      transition: all 0.25s ease;
    }

    .card:hover .badge {
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--glow);
    }

    .card-bottom {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.01em;
      transition: color 0.25s ease;
    }

    .card:hover .name {
      color: #ffffff;
    }

    .desc {
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <!-- ============================================================
       CYBERPUNK LOGIN SCREEN (ALA PYDRIVE 8000)
       ============================================================ -->
    <div id="login-container" class="login-wrapper">
    <div class="login-card" id="login-card-el">
      <!-- Cyber HUD Corner Accents -->
      <div class="corner-bracket corner-tl"></div>
      <div class="corner-bracket corner-tr"></div>
      <div class="corner-bracket corner-bl"></div>
      <div class="corner-bracket corner-br"></div>

      <!-- Top Bar Header -->
      <div class="login-top-bar">
        <div class="cyber-brand" id="card-header-title">TOPOLOGY.NET // <span class="text-white">STEP 1</span></div>
        <div class="status-indicator"><span class="dot"></span> ARMED</div>
      </div>

      <!-- ==================== STEP 1: MASTER PASSWORD ==================== -->
      <div class="login-body" id="step-password">
        <div class="login-hero">
          <div class="cyber-icon-hex">
            <svg class="logo" viewBox="0 0 24 24" style="width: 24px; height: 24px;">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="M12 8v4"/>
              <circle cx="12" cy="16" r="1"/>
            </svg>
          </div>
          <h2>HOMELAB TOPOLOGY ACCESS</h2>
          <p>ENTER MASTER KEY TO REQUEST TELEGRAM OTP</p>
        </div>

        <div id="login-error" class="error-box">[ACCESS_DENIED] // HASH_MISMATCH</div>

        <form id="login-form" autocomplete="off" onsubmit="handlePasswordSubmit(event);">
          <div class="form-group">
            <div class="form-label">
              <span>// MASTER_KEY</span>
              <span class="label-tag">SHA-256</span>
            </div>
            <div class="input-wrapper">
              <input type="password" id="portal-pwd" class="cyber-input" placeholder="ENTER ACCESS KEY..." autofocus required />
              <button type="button" id="btn-toggle-pwd" class="toggle-pwd" title="Show/Hide Key">
                <svg id="eye-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="login-options">
            <label class="remember-label">
              <input type="checkbox" id="remember-me" checked />
              <span>PERSIST_SESSION (30 DAYS)</span>
            </label>
          </div>

          <button type="submit" id="btn-submit-pwd" class="cyber-btn">
            <span>NEXT // SEND TELEGRAM OTP</span>
            <svg class="cyber-btn-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>
      </div>

      <!-- ==================== STEP 2: TELEGRAM OTP ==================== -->
      <div class="login-body" id="step-otp" style="display: none;">
        <div class="login-hero">
          <div class="cyber-icon-hex" style="border-color: var(--green); color: var(--green); box-shadow: 0 0 20px rgba(16,185,129,0.25);">
            <svg class="logo" viewBox="0 0 24 24" style="width: 24px; height: 24px; stroke: var(--green); fill: none;" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </div>
          <h2 style="color: var(--green);">2FA VERIFICATION</h2>
          <p>6-DIGIT CODE SENT TO TELEGRAM // MAX 2X KESEMPATAN</p>
        </div>

        <div id="otp-error" class="error-box">[INVALID_OTP]</div>

        <form id="otp-form" autocomplete="off" onsubmit="handleOtpSubmit(event);">
          <div class="form-group">
            <div class="form-label">
              <span>// TELEGRAM_OTP_CODE</span>
              <span class="label-tag" id="otp-timer" style="color: var(--green); border-color: rgba(16,185,129,0.3);">03:00</span>
            </div>
            <div class="input-wrapper">
              <input 
                type="text" 
                id="otp-input" 
                class="cyber-input" 
                placeholder="••••••" 
                maxlength="6" 
                inputmode="numeric" 
                pattern="[0-9]*" 
                style="text-align: center; font-size: 1.5rem; letter-spacing: 0.35em; font-weight: 800; color: var(--green); border-color: rgba(16,185,129,0.4); padding-right: 1rem;" 
                required 
              />
            </div>
          </div>

          <button type="submit" id="btn-submit-otp" class="cyber-btn" style="border-color: var(--green); color: var(--green); background: rgba(16,185,129,0.15);">
            <span>VERIFY OTP // UNLOCK TOPOLOGY</span>
            <svg class="cyber-btn-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px;">
            <button type="button" onclick="backToPassword()" style="background: none; border: none; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; cursor: pointer; letter-spacing: 0.05em;">
              &larr; BACK TO PASSWORD
            </button>
            <button type="button" id="btn-resend" onclick="resendOtp()" style="background: none; border: none; color: var(--cyan); font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; cursor: pointer; font-weight: 700; letter-spacing: 0.05em;">
              [ RESEND CODE ]
            </button>
          </div>
        </form>
      </div>

      <!-- Card Footer -->
      <div class="login-footer">
        <span>SECURITY_PROTOCOL</span>
        <span class="chip-badge">2FA PROTECTED</span>
      </div>
    </div>
  </div>

  <script>
    let currentOtpToken = null;
    let timerInterval = null;
    let secondsRemaining = 180;

    const passwordInput = document.getElementById('portal-pwd');
    const rememberCheckbox = document.getElementById('remember-me');
    const loginError = document.getElementById('login-error');
    const otpError = document.getElementById('otp-error');
    const loginCard = document.getElementById('login-card-el');
    const btnTogglePwd = document.getElementById('btn-toggle-pwd');
    const eyeSvg = document.getElementById('eye-svg');
    const btnSubmitPwd = document.getElementById('btn-submit-pwd');
    const btnSubmitOtp = document.getElementById('btn-submit-otp');
    const otpInput = document.getElementById('otp-input');
    const otpTimerEl = document.getElementById('otp-timer');
    const cardTitle = document.getElementById('card-header-title');

    btnTogglePwd.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeSvg.innerHTML = isPassword
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    });

    function triggerShake() {
      loginCard.classList.remove('shake');
      void loginCard.offsetWidth;
      loginCard.classList.add('shake');
    }

    function startTimer(duration) {
      clearInterval(timerInterval);
      secondsRemaining = duration;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        secondsRemaining--;
        updateTimerDisplay();
        if (secondsRemaining <= 0) {
          clearInterval(timerInterval);
          otpTimerEl.innerText = "EXPIRED";
          otpTimerEl.style.color = "var(--pink)";
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(secondsRemaining / 60).toString().padStart(2, '0');
      const secs = (secondsRemaining % 60).toString().padStart(2, '0');
      otpTimerEl.innerText = `${mins}:${secs}`;
    }

    async function handlePasswordSubmit(e) {
      e.preventDefault();
      const enteredPassword = passwordInput.value;
      if (!enteredPassword) return;

      loginError.style.display = 'none';
      passwordInput.disabled = true;
      btnSubmitPwd.querySelector('span').innerText = "VERIFYING KEY...";

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: enteredPassword,
            remember: rememberCheckbox ? rememberCheckbox.checked : false
          })
        });
        const data = await res.json();

        if (res.ok && data.success && data.require_otp) {
          currentOtpToken = data.otp_token;
          passwordInput.disabled = false;
          btnSubmitPwd.querySelector('span').innerText = "NEXT // SEND TELEGRAM OTP";

          document.getElementById('step-password').style.display = 'none';
          document.getElementById('step-otp').style.display = 'block';
          cardTitle.innerHTML = 'TOPOLOGY.NET // <span style="color: var(--green);">STEP 2 (2FA)</span>';

          startTimer(data.expires_in || 180);
          otpInput.value = '';
          setTimeout(() => otpInput.focus(), 150);
        } else {
          passwordInput.disabled = false;
          btnSubmitPwd.querySelector('span').innerText = "NEXT // SEND TELEGRAM OTP";
          loginError.innerText = data.error || '[ACCESS_DENIED] // INVALID MASTER KEY';
          loginError.style.display = 'block';
          triggerShake();
          passwordInput.select();
        }
      } catch (err) {
        passwordInput.disabled = false;
        btnSubmitPwd.querySelector('span').innerText = "NEXT // SEND TELEGRAM OTP";
        loginError.innerText = '[NETWORK_ERROR] // ' + err.message;
        loginError.style.display = 'block';
      }
    }

    async function handleOtpSubmit(e) {
      e.preventDefault();
      const code = otpInput.value.trim();
      if (!code || code.length < 6) return;

      otpError.style.display = 'none';
      otpInput.disabled = true;
      btnSubmitOtp.querySelector('span').innerText = "AUTHENTICATING 2FA...";

      try {
        const res = await fetch('/api/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            otp_token: currentOtpToken,
            code: code
          })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          btnSubmitOtp.querySelector('span').innerText = "GRANTED // LOADING...";
          window.location.reload();
        } else {
          btnSubmitOtp.querySelector('span').innerText = "VERIFY OTP // UNLOCK TOPOLOGY";
          otpError.innerText = data.error || '[INVALID_OTP] // WRONG CODE';
          otpError.style.display = 'block';
          triggerShake();
          if (data.error && (data.error.includes('IP_LOCKED') || data.error.includes('TERKUNCI'))) {
            otpInput.disabled = true;
            btnSubmitOtp.disabled = true;
            btnSubmitOtp.style.opacity = '0.5';
            btnSubmitOtp.style.cursor = 'not-allowed';
            clearInterval(timerInterval);
            otpTimerEl.innerText = "LOCKED (24H)";
            otpTimerEl.style.color = "var(--yellow)";
          } else {
            otpInput.disabled = false;
            otpInput.select();
          }
        }
      } catch (err) {
        otpInput.disabled = false;
        btnSubmitOtp.querySelector('span').innerText = "VERIFY OTP // UNLOCK TOPOLOGY";
        otpError.innerText = '[NETWORK_ERROR] // ' + err.message;
        otpError.style.display = 'block';
      }
    }

    async function resendOtp() {
      if (!currentOtpToken) return;
      const btn = document.getElementById('btn-resend');
      btn.innerText = "SENDING...";
      try {
        const res = await fetch('/api/resend-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ otp_token: currentOtpToken })
        });
        const d = await res.json();
        if (d.success) {
          startTimer(d.expires_in || 180);
          btn.innerText = "[ SENT! ]";
          setTimeout(() => btn.innerText = "[ RESEND CODE ]", 2500);
        } else {
          alert(d.error || 'Failed to resend');
          btn.innerText = "[ RESEND CODE ]";
        }
      } catch (e) {
        btn.innerText = "[ RESEND CODE ]";
      }
    }

    function backToPassword() {
      clearInterval(timerInterval);
      document.getElementById('step-otp').style.display = 'none';
      document.getElementById('step-password').style.display = 'block';
      cardTitle.innerHTML = 'TOPOLOGY.NET // <span class="text-white">STEP 1</span>';
      setTimeout(() => passwordInput.focus(), 150);
    }
  </script>
</body>
</html>
